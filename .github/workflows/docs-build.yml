name: Docs Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-build:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/docs-build/package-lock.json

      - name: Install docs build dependencies
        run: npm ci --prefix tools/docs-build

      - name: Audit docs build dependencies
        run: npm audit --prefix tools/docs-build --audit-level=high

      - name: Run docs build
        run: npm --prefix tools/docs-build run build

  cr-probe:
    name: crprobe tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A separate job on purpose: a bug in the tooling must never block a
    # documentation fix, and the docs gate must never wait on Python.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run crprobe tests
        working-directory: tools/cr-probe
        # No network and no credentials here: every test is offline by design,
        # so CI cannot depend on the live API being up or on a key being valid.
        run: uv run --frozen pytest -q
